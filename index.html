<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#06122a">
<title>Kulzzy Radio Network</title><style>
*{box-sizing:border-box}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#06122a;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:12px;
}

.radio{
    width:100%;
    max-width:520px;
    background:#081831;
    border:1px solid rgba(255,215,0,.35);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 8px 30px rgba(0,0,0,.35);
}

.header{
    padding:18px 15px;
    text-align:center;
    background:#0c2045;
    border-bottom:1px solid rgba(255,215,0,.25);
}

.logo{
    font-size:23px;
    font-weight:900;
    letter-spacing:1px;
    color:#ffd700;
}

.slogan{
    margin-top:5px;
    font-size:12px;
    color:#fff;
}

.live-badge{
    display:inline-block;
    margin-top:10px;
    padding:5px 12px;
    border:1px solid #ffd700;
    border-radius:20px;
    color:#ffd700;
    font-size:11px;
    font-weight:bold;
}

.player{
    padding:24px 18px;
    text-align:center;
}

.status{
    display:none;
    margin:0 0 18px;
    color:#ff3333;
    font-weight:900;
    font-size:16px;
}

.play-button{
    width:78px;
    height:78px;
    border:2px solid #ffd700;
    border-radius:50%;
    background:#ffd700;
    color:#06122a;
    font-size:30px;
    font-weight:bold;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    -webkit-tap-highlight-color:transparent;
}

.play-button:active{
    transform:scale(.96);
}

.play-button:disabled{
    opacity:.65;
}

#normalAudio{
    display:none;
}

.live-audio{
    display:none;
    width:100%;
    margin-top:8px;
}

.live-audio audio{
    width:100%;
    height:42px;
}

.footer{
    padding:12px;
    text-align:center;
    font-size:11px;
    color:#ffd700;
    border-top:1px solid rgba(255,215,0,.2);
}

.hidden{
    display:none!important;
}
</style></head><body><div class="radio"><div class="header">
    <div class="logo">KULZZY RADIO NETWORK</div>
    <div class="slogan">Celebrating Lives Everyday</div>
    <div class="live-badge">● LIVE</div>
</div>

<div class="player">

    <div id="statusText" class="status">🔴 LIVE ON AIR</div>

    <button
        id="playButton"
        class="play-button"
        type="button"
        aria-label="Play audio"
    >▶</button>

    <audio id="normalAudio" preload="auto" playsinline></audio>

    <div id="liveAudioBox" class="live-audio">
        <audio
            id="goCastLiveAudio"
            controls
            playsinline
            preload="none"
        ></audio>
    </div>

</div>

<div class="footer">
    KULZZY RADIO NETWORK
</div>

</div><script>
(function(){

"use strict";

const CONFIG_URL = "./config.json";

const CLOUDINARY_AUDIO_URL =
"https://res.cloudinary.com/s4j0x7dk/video/upload/v1788195407/smnabqvzrzwnhyxk3usp.mp3";

const LIVE_STREAM_URL =
"https://icecast.gocast.fm/stream/kulzzy-radio-network";

const normalAudio = document.getElementById("normalAudio");
const liveAudio = document.getElementById("goCastLiveAudio");
const liveAudioBox = document.getElementById("liveAudioBox");
const playButton = document.getElementById("playButton");
const statusText = document.getElementById("statusText");

let currentAudioUrl = "";
let currentMode = "AUDIO";
let isLoading = false;
let lastRefresh = -1;

normalAudio.loop = false;

function cleanUrl(url){
    return String(url || "").trim();
}

function cloudinaryOrConfiguredAudio(config){
    const configured = cleanUrl(config.currentAudio);

    if(
        configured &&
        configured.includes("res.cloudinary.com")
    ){
        return configured;
    }

    return CLOUDINARY_AUDIO_URL;
}

function updatePlayButton(){
    playButton.textContent = normalAudio.paused ? "▶" : "❚❚";
    playButton.setAttribute(
        "aria-label",
        normalAudio.paused ? "Play audio" : "Pause audio"
    );
}

function switchToLive(){
    if(currentMode !== "LIVE"){
        normalAudio.pause();

        currentMode = "LIVE";

        playButton.classList.add("hidden");
        liveAudioBox.style.display = "block";
        statusText.style.display = "block";

        liveAudio.src = LIVE_STREAM_URL;
        liveAudio.load();
    }else{
        playButton.classList.add("hidden");
        liveAudioBox.style.display = "block";
        statusText.style.display = "block";
    }
}

function switchToAudio(audioUrl, forceReload){
    audioUrl = cleanUrl(audioUrl) || CLOUDINARY_AUDIO_URL;

    const changedFromLive = currentMode === "LIVE";

    currentMode = "AUDIO";

    liveAudio.pause();
    liveAudioBox.style.display = "none";
    statusText.style.display = "none";
    playButton.classList.remove("hidden");

    if(
        forceReload ||
        changedFromLive ||
        currentAudioUrl !== audioUrl
    ){
        normalAudio.pause();

        currentAudioUrl = audioUrl;
        normalAudio.src = audioUrl;
        normalAudio.load();
    }

    updatePlayButton();
}

async function loadConfig(){
    try{
        const response = await fetch(
            CONFIG_URL + "?t=" + Date.now(),
            {cache:"no-store"}
        );

        if(!response.ok) return;

        const config = await response.json();

        const mode = String(config.status || "AUDIO")
            .trim()
            .toUpperCase();

        const refreshNumber = Number(config.refresh || 0);

        if(mode === "LIVE"){
            switchToLive();
            return;
        }

        const selectedAudio = cloudinaryOrConfiguredAudio(config);

        const forceReload =
            refreshNumber !== lastRefresh &&
            lastRefresh !== -1;

        lastRefresh = refreshNumber;

        switchToAudio(selectedAudio, forceReload);

    }catch(error){
        if(currentMode !== "LIVE"){
            switchToAudio(CLOUDINARY_AUDIO_URL, false);
        }
    }
}

playButton.addEventListener("click", async function(){
    if(isLoading || currentMode === "LIVE") return;

    isLoading = true;
    playButton.disabled = true;

    try{
        if(normalAudio.paused){
            if(!normalAudio.src){
                normalAudio.src = CLOUDINARY_AUDIO_URL;
                currentAudioUrl = CLOUDINARY_AUDIO_URL;
                normalAudio.load();
            }

            await normalAudio.play();
        }else{
            normalAudio.pause();
        }
    }catch(error){
        console.error("Audio playback error:", error);
    }

    updatePlayButton();

    playButton.disabled = false;
    isLoading = false;
});

normalAudio.addEventListener("play", updatePlayButton);
normalAudio.addEventListener("pause", updatePlayButton);

normalAudio.addEventListener("ended", function(){
    updatePlayButton();

    window.parent.postMessage({
        type:"KULZZY_AUDIOVISUALS",
        action:"audio-ended"
    },"*");

    normalAudio.currentTime = 0;
    normalAudio.play().catch(function(){});
});

normalAudio.addEventListener("play", function(){
    window.parent.postMessage({
        type:"KULZZY_AUDIOVISUALS",
        action:"audio-playing"
    },"*");
});

liveAudio.addEventListener("error", function(){
    console.error("The live stream could not be played.");
});

loadConfig();

setInterval(loadConfig, 1000);

})();
</script></body>
</html>
