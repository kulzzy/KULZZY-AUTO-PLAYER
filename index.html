<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06122a">
<title>Kulzzy Radio Network</title>

<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;min-height:0;margin:0;padding:0;overflow:hidden}
body{background:#06122a;color:#fff;font-family:Arial,Helvetica,sans-serif}
.radio{width:100%;height:100%;overflow:hidden}

.audio-panel,.live-panel{
width:100%;height:100%;min-width:0;background:#fff;overflow:hidden
}

.audio-panel{border:2px solid #ffd700}
.audio-panel.hidden{display:none}
.live-panel{display:none;border:1px solid #dedede}
.live-panel.visible{display:flex;flex-direction:column}

.header{
width:100%;height:70%;min-height:0;padding:4px 8px;
display:flex;align-items:center;justify-content:space-between;
gap:5px;background:#fff
}

.brand{
display:flex;align-items:center;gap:6px;
flex:1 1 auto;min-width:0
}

.brand-dot{
width:clamp(9px,2.5vw,18px);
height:clamp(9px,2.5vw,18px);
flex:0 0 auto;border-radius:50%;background:#ff1025;
box-shadow:0 0 10px rgba(255,0,35,.6)
}

.brand-text{min-width:0}

.brand-name{
color:#06122a;font-size:clamp(11px,3vw,22px);
line-height:1.05;font-weight:900
}

.slogan{
margin-top:2px;color:#555;
font-size:clamp(8px,1.7vw,12px);line-height:1.1
}

.play-button{
position:relative;z-index:5;
width:clamp(56px,13vw,88px);
height:clamp(56px,13vw,88px);
flex:0 0 auto;padding:0;
border:3px solid #ffd700;
border-radius:50%;
background:radial-gradient(circle at 35% 30%,#ff2638,#ed001d 72%);
color:#fff;font-size:clamp(30px,6vw,48px);
display:flex;align-items:center;justify-content:center;
cursor:pointer;touch-action:manipulation;
-webkit-tap-highlight-color:transparent;
box-shadow:0 0 15px rgba(255,0,30,.32)
}

.play-button:disabled{opacity:.65;cursor:wait}
.play-button span{line-height:1;pointer-events:none}

.play-area{
width:100%;height:30%;min-height:0;padding:1px 5px;
display:flex;flex-direction:column;justify-content:center;
align-items:center;gap:1px;background:#fff;overflow:hidden
}

.now-playing,
.player-message,
.live-status,
.live-message{
display:none!important
}

.live-header{
width:100%;height:70%;min-height:0;padding:4px 8px;
display:flex;align-items:center;justify-content:space-between;
gap:5px;background:#fff
}

.live-logo{
display:flex;align-items:center;gap:6px;
flex:1 1 auto;min-width:0;
color:#06122a;font-size:clamp(11px,3vw,22px);
font-weight:900;line-height:1.05
}

.live-logo-text{min-width:0}

.live-subtitle{
margin-top:2px;color:#555;
font-size:clamp(8px,1.7vw,12px);line-height:1.1;
font-weight:normal
}

.live-content{
width:100%;height:30%;min-height:0;
padding:1px 5px;background:#fff;
display:flex;justify-content:center;
align-items:center;overflow:hidden
}

@media(max-width:360px){
.header,.live-header{padding:3px 5px;gap:4px}
.brand,.live-logo{gap:4px}
.brand-name,.live-logo{font-size:11px}
.slogan,.live-subtitle{font-size:7px}
.play-button{width:56px;height:56px;font-size:30px}
}

@media(min-width:600px){
.header,.live-header{padding:5px 12px}
.play-button{width:82px;height:82px}
}

.audio-panel,
.live-panel,
.header,
.play-area,
.live-header,
.live-content{
animation:radioBackground 10s steps(1,end) infinite;
}

@keyframes radioBackground{
0%{background-color:#ffffff}
10%{background-color:#06122a}
20%{background-color:#ffd700}
30%{background-color:#8b0000}
40%{background-color:#4b0082}
50%{background-color:#006400}
60%{background-color:#ff6600}
70%{background-color:#000000}
80%{background-color:#008b8b}
90%{background-color:#800020}
100%{background-color:#ffffff}
}
</style>
</head>

<body>
<div class="radio">

<section id="audioPanel" class="audio-panel">

<header class="header">

<div class="brand">
<div class="brand-dot"></div>

<div class="brand-text">
<div class="brand-name">KULZZY RADIO<br>NETWORK</div>
<div class="slogan">Celebrating Lives Everyday</div>
</div>
</div>

<button id="playButton" class="play-button" type="button" aria-label="Play Kulzzy Radio">
<span id="playIcon">▶</span>
</button>

</header>

<div class="play-area">
<div id="audioTitle" class="now-playing"></div>
<div id="audioMessage" class="player-message"></div>
<audio id="normalAudio" preload="none" playsinline></audio>
</div>

</section>


<section id="livePanel" class="live-panel">

<header class="live-header">

<div class="brand">
<div class="brand-dot"></div>

<div class="brand-text">
<div class="brand-name">KULZZY RADIO<br>NETWORK</div>
<div class="slogan">Celebrating Lives Everyday</div>
</div>
</div>

<button id="liveListenButton" class="play-button" type="button" aria-label="Listen to Kulzzy Radio Live">
<span id="livePlayIcon">▶</span>
</button>

</header>

<div class="live-content">

<div id="liveStatus" class="live-status"></div>

<div id="liveMessage" class="live-message"></div>

<audio id="liveAudio" preload="none" playsinline></audio>

</div>

</section>

</div>

<script>
"use strict";

(function(){

const CONFIG_URL="./config.json";
const DEFAULT_LIVE_URL="https://kulzzy-radio-icecast.onrender.com/kulzzy.mp3";
const LIVE_WAIT_LIMIT=70000;

const $=id=>document.getElementById(id);

const audioPanel=$("audioPanel");
const livePanel=$("livePanel");
const normalAudio=$("normalAudio");
const liveAudio=$("liveAudio");
const playButton=$("playButton");
const playIcon=$("playIcon");
const liveListenButton=$("liveListenButton");
const livePlayIcon=$("livePlayIcon");
const liveMessage=$("liveMessage");
const audioTitle=$("audioTitle");
const audioMessage=$("audioMessage");

let currentMode="";
let currentAudioURL="";
let currentLiveURL=DEFAULT_LIVE_URL;
let currentRefresh=null;
let audioPlayMode="REPEAT";
let configRequestRunning=false;
let normalWasPlayingBeforeLive=false;
let liveWaitTimer=null;
let liveAttempt=0;

function cleanTitle(value){
    const title=String(value||"").trim();

    if(!title ||
       title.toLowerCase().includes("automatic audio") ||
       title.toLowerCase().includes("now playing kulzzy radio")){
        return "CELEBRATING LIVES EVERYDAY";
    }

    return title;
}

function setNormalButton(playing){
    playIcon.textContent=playing?"Ⅱ":"▶";
    playButton.setAttribute(
        "aria-label",
        playing?"Pause Kulzzy Radio":"Play Kulzzy Radio"
    );
}

function setLiveButton(playing){
    livePlayIcon.textContent=playing?"Ⅱ":"▶";
    liveListenButton.setAttribute(
        "aria-label",
        playing?"Pause Kulzzy Radio Live":"Listen to Kulzzy Radio Live"
    );
}

function showNormalPanel(){
    audioPanel.classList.remove("hidden");
    livePanel.classList.remove("visible");
}

function showLivePanel(){
    audioPanel.classList.add("hidden");
    livePanel.classList.add("visible");
}

function clearLiveTimer(){
    if(liveWaitTimer){
        clearTimeout(liveWaitTimer);
        liveWaitTimer=null;
    }
}

function stopNormalAudio(){
    normalAudio.pause();
    normalAudio.removeAttribute("src");
    normalAudio.load();
    currentAudioURL="";
    setNormalButton(false);
}

function stopLiveAudio(){
    clearLiveTimer();
    liveAudio.pause();
    liveAudio.removeAttribute("src");
    liveAudio.load();
    liveListenButton.disabled=false;
    setLiveButton(false);
}

function getAudioURL(config){
    const value=String(config.currentAudio||"").trim();
    if(!value)return "";

    try{
        return new URL(value,window.location.href).href;
    }catch(error){
        return value;
    }
}

function getLiveURL(config){
    return String(config.liveStreamUrl||"").trim()||DEFAULT_LIVE_URL;
}

async function startLiveAudio(){

    if(currentMode!=="LIVE")return;

    if(!liveAudio.paused){
        liveAudio.pause();
        return;
    }

    clearLiveTimer();

    liveAttempt++;

    liveListenButton.disabled=true;
    liveMessage.textContent="Connecting...";

    liveAudio.pause();

    const separator=currentLiveURL.includes("?")?"&":"?";

    liveAudio.src=currentLiveURL+separator+"t="+Date.now();
    liveAudio.load();

    liveWaitTimer=setTimeout(function(){

        if(liveAudio.paused || liveAudio.readyState<2){
            liveAudio.pause();
            liveListenButton.disabled=false;
            setLiveButton(false);
            liveMessage.textContent="Connection taking too long. Please try again.";
        }

    },LIVE_WAIT_LIMIT);

    try{
        await liveAudio.play();
    }catch(error){
        clearLiveTimer();

        console.error("Live audio error:",error);

        liveListenButton.disabled=false;
        setLiveButton(false);
        liveMessage.textContent="Live audio could not connect. Please try again.";
    }
}

function switchToLive(config){

    if(currentMode!=="LIVE"){
        normalWasPlayingBeforeLive=!normalAudio.paused;
        stopNormalAudio();
        currentMode="LIVE";
    }

    const newURL=getLiveURL(config);

    if(newURL!==currentLiveURL){
        currentLiveURL=newURL;
        stopLiveAudio();
    }

    showLivePanel();

    if(liveAudio.paused){
        liveListenButton.disabled=false;
        setLiveButton(false);
    }
}

function switchToNormalAudio(config,forceReload){

    const wasLive=currentMode==="LIVE";

    if(wasLive){
        stopLiveAudio();
        currentMode="AUDIO";
    }else{
        currentMode="AUDIO";
    }

    showNormalPanel();

    const audioURL=getAudioURL(config);

    audioPlayMode=String(config.playMode||"REPEAT").toUpperCase();
    normalAudio.loop=audioPlayMode!=="ONCE";

    audioTitle.textContent=cleanTitle(
        config.nowPlaying||
        config.normalAudioTitle||
        config.title
    );

    if(!audioURL){
        stopNormalAudio();
        audioMessage.textContent="No normal audio is saved.";
        normalWasPlayingBeforeLive=false;
        return;
    }

    if(forceReload||currentAudioURL!==audioURL){
        stopNormalAudio();
        currentAudioURL=audioURL;
        normalAudio.src=audioURL;
        normalAudio.load();
        audioMessage.textContent="Audio is ready.";
    }

    if(wasLive&&normalWasPlayingBeforeLive){
        normalWasPlayingBeforeLive=false;

        normalAudio.play().then(function(){
            audioMessage.textContent="Enjoy listening.";
        }).catch(function(){
            audioMessage.textContent="Tap the button to resume listening.";
        });
    }
}

async function loadConfig(){

    if(configRequestRunning)return;

    configRequestRunning=true;

    try{
        const response=await fetch(
            CONFIG_URL+"?t="+Date.now(),
            {cache:"no-store"}
        );

        if(!response.ok){
            throw new Error("Could not load radio settings.");
        }

        const config=await response.json();

        const status=String(
            config.status||config.mode||"AUDIO"
        ).trim().toUpperCase();

        const refreshChanged=
            currentRefresh!==null&&config.refresh!==currentRefresh;

        currentRefresh=config.refresh;

        if(status==="LIVE"){
            switchToLive(config);
        }else{
            switchToNormalAudio(config,refreshChanged);
        }

    }catch(error){
        console.error("Kulzzy Radio configuration:",error);

        if(!currentMode){
            showNormalPanel();
            audioMessage.textContent="Unable to load radio settings.";
        }
    }finally{
        configRequestRunning=false;
    }
}

/* NORMAL AUDIO */

playButton.addEventListener("click",async function(event){

    event.preventDefault();
    event.stopPropagation();

    if(currentMode==="LIVE")return;

    if(!normalAudio.paused){
        normalAudio.pause();
        return;
    }

    if(!normalAudio.getAttribute("src")){
        audioMessage.textContent="No normal audio is available.";
        return;
    }

    playButton.disabled=true;

    try{
        await normalAudio.play();
        audioMessage.textContent="Enjoy listening.";
    }catch(error){
        console.error("Normal audio error:",error);
        audioMessage.textContent="Audio could not start. Try again.";
    }finally{
        playButton.disabled=false;
    }

},{passive:false});

/* LIVE AUDIO */

liveListenButton.addEventListener("click",function(event){
    event.preventDefault();
    event.stopPropagation();
    startLiveAudio();
},{passive:false});

liveAudio.addEventListener("playing",function(){
    clearLiveTimer();
    liveListenButton.disabled=false;
    setLiveButton(true);
    liveMessage.textContent="You are listening to Kulzzy Radio LIVE.";
});

liveAudio.addEventListener("waiting",function(){
    liveMessage.textContent="Connecting to the live broadcast...";
});

liveAudio.addEventListener("stalled",function(){
    liveMessage.textContent="The live stream is buffering...";
});

liveAudio.addEventListener("error",function(){
    clearLiveTimer();
    liveListenButton.disabled=false;
    setLiveButton(false);
    liveMessage.textContent="Live audio is temporarily unavailable.";
});

liveAudio.addEventListener("pause",function(){
    clearLiveTimer();

    if(currentMode==="LIVE"){
        liveListenButton.disabled=false;
        setLiveButton(false);
        liveMessage.textContent="Live broadcast paused.";
    }
});

/* NORMAL AUDIO EVENTS */

normalAudio.addEventListener("play",function(){
    setNormalButton(true);
});

normalAudio.addEventListener("pause",function(){
    setNormalButton(false);
});

normalAudio.addEventListener("ended",function(){

    if(currentMode!=="AUDIO")return;

    if(audioPlayMode==="ONCE"){
        setNormalButton(false);
        audioMessage.textContent="Audio finished playing.";
        return;
    }

    normalAudio.currentTime=0;
    normalAudio.play().catch(function(error){
        console.error(error);
    });
});

normalAudio.addEventListener("error",function(){
    if(currentMode!=="AUDIO")return;

    audioMessage.textContent="Audio could not load.";
});

/* START */

loadConfig();
setInterval(loadConfig,5000);

})();
</script>

</body>
</html>
