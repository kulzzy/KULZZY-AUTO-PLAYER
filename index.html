<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06122a">
<title>Kulzzy Radio Network</title>

<style>
*{box-sizing:border-box}

html,body{
    width:100%;
    min-height:100%;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    min-height:100dvh;
    padding:clamp(4px,1.2vw,16px);
    background:#06122a;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}

.radio{
    width:100%;
    max-width:1100px;
    min-width:0;
    margin:auto;
    background:#031326;
    border:clamp(2px,.45vw,5px) solid #ffd700;
    overflow:hidden;
    box-shadow:0 5px 24px rgba(0,0,0,.3);
}

.main-panel{
    width:100%;
    min-width:0;
    display:flex;
    flex-direction:column;
    background:linear-gradient(120deg,#061b31,#031326);
}

.header{
    width:100%;
    min-width:0;
    min-height:clamp(100px,18vw,175px);
    padding:clamp(10px,3vw,28px);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:clamp(8px,2vw,24px);
    border-bottom:2px solid rgba(255,255,255,.12);
}

.brand{
    display:flex;
    align-items:center;
    gap:clamp(8px,2vw,22px);
    flex:1 1 auto;
    min-width:0;
}

.brand-dot{
    width:clamp(15px,4vw,42px);
    height:clamp(15px,4vw,42px);
    flex:0 0 auto;
    border-radius:50%;
    background:#ff1025;
    box-shadow:0 0 22px rgba(255,0,35,.6);
}

.brand-text{min-width:0}

.brand-name{
    color:#ffd700;
    font-size:clamp(17px,4.1vw,43px);
    line-height:1.13;
    font-weight:900;
    letter-spacing:.2px;
    overflow-wrap:break-word;
}

.slogan{
    margin-top:clamp(5px,1.4vw,15px);
    color:#c8d2df;
    font-size:clamp(11px,2.4vw,25px);
    line-height:1.3;
}

.live-badge{
    width:clamp(58px,13vw,145px);
    height:clamp(58px,13vw,145px);
    flex:0 0 auto;
    border-radius:50%;
    background:#f20c20;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(2px,.7vw,8px);
    color:#fff;
    font-size:clamp(13px,2.8vw,31px);
    font-weight:bold;
}

.live-dot{
    font-size:clamp(14px,2.8vw,28px);
    line-height:1;
}

.play-area{
    width:100%;
    min-width:0;
    min-height:clamp(180px,32vw,350px);
    padding:clamp(16px,3.5vw,35px) 12px;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.play-button{
    width:clamp(85px,16vw,175px);
    height:clamp(85px,16vw,175px);
    max-width:70%;
    max-height:55vh;
    aspect-ratio:1/1;
    flex:0 1 auto;
    padding:0;
    border:clamp(4px,.7vw,7px) solid #ffd700;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ff2638,#ed001d 72%);
    color:#fff;
    font-size:clamp(36px,6vw,68px);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 0 35px rgba(255,0,30,.32);
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    transition:transform .15s ease;
}

.play-button:active{transform:scale(.96)}
.play-button:disabled{opacity:.7;cursor:wait}

.play-button span{
    display:block;
    line-height:1;
    margin-left:.1em;
}

.play-button.playing span{
    margin-left:0;
    font-size:.68em;
    letter-spacing:3px;
}

#normalAudio,#liveAudio{display:none}

/* Small phones */
@media(max-width:360px){
    body{padding:4px}

    .header{
        min-height:96px;
        padding:10px 8px;
        gap:6px;
    }

    .brand{gap:7px}

    .brand-name{font-size:clamp(15px,4.5vw,17px)}

    .slogan{
        font-size:10px;
        margin-top:5px;
    }

    .live-badge{
        width:53px;
        height:53px;
        font-size:12px;
    }

    .live-dot{font-size:13px}

    .play-area{
        min-height:165px;
        padding:12px;
    }

    .play-button{
        width:85px;
        height:85px;
        max-width:70%;
        font-size:35px;
    }
}

/* Tablets */
@media(min-width:600px){
    .radio{max-width:900px}

    .header{padding:clamp(20px,3vw,32px)}

    .play-area{min-height:clamp(240px,32vw,350px)}
}

/* Desktops */
@media(min-width:1000px){
    .radio{max-width:1100px}

    .header{min-height:175px}

    .play-area{min-height:350px}

    .play-button{
        width:175px;
        height:175px;
    }
}

/* Short screens and landscape phones */
@media(max-height:500px){
    body{align-items:flex-start}

    .header{
        min-height:80px;
        padding:10px 16px;
    }

    .brand-name{font-size:clamp(16px,3.5vw,30px)}

    .slogan{
        margin-top:5px;
        font-size:clamp(10px,1.8vw,17px);
    }

    .live-badge{
        width:clamp(48px,12vh,70px);
        height:clamp(48px,12vh,70px);
        font-size:clamp(12px,2.5vh,16px);
    }

    .live-dot{font-size:14px}

    .play-area{
        min-height:115px;
        padding:8px;
    }

    .play-button{
        width:clamp(70px,18vh,100px);
        height:clamp(70px,18vh,100px);
        max-height:35vh;
    }
}

@media(prefers-reduced-motion:reduce){
    .play-button{transition:none}
}
</style>
</head>

<body>
<div class="radio">
<main class="main-panel">

<header class="header">
    <div class="brand">
        <div class="brand-dot"></div>

        <div class="brand-text">
            <div class="brand-name">
                KULZZY RADIO<br>NETWORK
            </div>

            <div class="slogan">
                Celebrating Lives Everyday
            </div>
        </div>
    </div>

    <div class="live-badge">
        <span class="live-dot">●</span>
        <span>LIVE</span>
    </div>
</header>

<section class="play-area">
    <button
        id="playButton"
        class="play-button"
        type="button"
        aria-label="Play Kulzzy Radio"
    >
        <span id="playIcon">▶</span>
    </button>

    <audio id="normalAudio" preload="auto" playsinline></audio>
    <audio id="liveAudio" preload="none" playsinline></audio>
</section>

</main>
</div>

<script>
(function(){
"use strict";

const CONFIG_URL="./config.json";

const CLOUDINARY_AUDIO_URL=
"https://res.cloudinary.com/s4j0x7dk/video/upload/v1788195407/smnabqvzrzwnhyxk3usp.mp3";

const LIVE_STREAM_URL=
"https://icecast.gocast.fm/stream/kulzzy-radio-network";

const audio=document.getElementById("normalAudio");
const liveAudio=document.getElementById("liveAudio");
const playButton=document.getElementById("playButton");
const playIcon=document.getElementById("playIcon");

let mode="AUDIO";
let currentTrack="";
let isLoading=false;
let needsRandomStart=true;
let lastRefresh=-1;
let playbackRequest=0;

audio.loop=false;

function setButtonState(playing){
    playIcon.textContent=playing?"Ⅱ":"▶";
    playButton.classList.toggle("playing",playing);

    playButton.setAttribute(
        "aria-label",
        playing?"Pause Kulzzy Radio":"Play Kulzzy Radio"
    );
}

function waitForMetadata(requestId){
    return new Promise(function(resolve,reject){

        if(
            audio.readyState>=1 &&
            Number.isFinite(audio.duration) &&
            audio.duration>0
        ){
            resolve();
            return;
        }

        function cleanup(){
            audio.removeEventListener("loadedmetadata",ready);
            audio.removeEventListener("durationchange",ready);
            audio.removeEventListener("error",failed);
        }

        function ready(){
            if(
                requestId!==playbackRequest ||
                mode!=="AUDIO"
            ){
                cleanup();
                resolve();
                return;
            }

            if(
                audio.readyState>=1 &&
                Number.isFinite(audio.duration) &&
                audio.duration>0
            ){
                cleanup();
                resolve();
            }
        }

        function failed(){
            cleanup();
            reject(new Error("Audio could not be loaded."));
        }

        audio.addEventListener("loadedmetadata",ready);
        audio.addEventListener("durationchange",ready);
        audio.addEventListener("error",failed);

        audio.load();
        ready();
    });
}

function waitForSeek(requestId){
    return new Promise(function(resolve){

        if(!audio.seeking){
            resolve();
            return;
        }

        let finished=false;
        let timer;

        function done(){
            if(finished)return;

            finished=true;
            audio.removeEventListener("seeked",done);
            clearInterval(timer);
            resolve();
        }

        audio.addEventListener("seeked",done);

        timer=setInterval(function(){
            if(
                requestId!==playbackRequest ||
                mode!=="AUDIO" ||
                !audio.seeking
            ){
                done();
            }
        },100);

        setTimeout(done,5000);
    });
}

async function chooseRandomPosition(requestId){

    await waitForMetadata(requestId);

    if(
        requestId!==playbackRequest ||
        mode!=="AUDIO"
    ){
        return;
    }

    const duration=audio.duration;

    if(!Number.isFinite(duration)||duration<=3){
        needsRandomStart=false;
        return;
    }

    const maxPosition=Math.max(1,Math.floor(duration-2));

    audio.currentTime=Math.floor(Math.random()*maxPosition);

    await waitForSeek(requestId);

    if(
        requestId===playbackRequest &&
        mode==="AUDIO"
    ){
        needsRandomStart=false;
    }
}

async function playNormalAudio(){

    if(isLoading)return;

    isLoading=true;
    playButton.disabled=true;

    const requestId=++playbackRequest;

    try{

        if(
            !audio.src ||
            currentTrack!==CLOUDINARY_AUDIO_URL
        ){
            audio.pause();

            currentTrack=CLOUDINARY_AUDIO_URL;
            audio.src=CLOUDINARY_AUDIO_URL;

            needsRandomStart=true;
            audio.load();
        }

        if(needsRandomStart){
            await chooseRandomPosition(requestId);
        }

        if(
            requestId!==playbackRequest ||
            mode!=="AUDIO"
        ){
            return;
        }

        await audio.play();
        setButtonState(true);

    }catch(error){

        setButtonState(false);
        console.error("Kulzzy Radio playback error:",error);

    }finally{

        playButton.disabled=false;
        isLoading=false;
    }
}

function switchToLive(){

    if(mode!=="LIVE"){

        playbackRequest++;
        audio.pause();

        mode="LIVE";

        liveAudio.src=LIVE_STREAM_URL;
        liveAudio.load();
    }

    setButtonState(!liveAudio.paused);
}

function switchToAudio(forceReload){

    const wasLive=mode==="LIVE";

    if(wasLive){

        liveAudio.pause();
        liveAudio.removeAttribute("src");
        liveAudio.load();

        currentTrack="";
        needsRandomStart=true;
    }

    mode="AUDIO";

    if(forceReload){

        audio.pause();
        currentTrack="";
        needsRandomStart=true;
    }

    if(
        !audio.src ||
        currentTrack!==CLOUDINARY_AUDIO_URL
    ){

        audio.pause();

        currentTrack=CLOUDINARY_AUDIO_URL;
        audio.src=CLOUDINARY_AUDIO_URL;

        audio.load();
        needsRandomStart=true;
    }

    setButtonState(!audio.paused);
}

async function loadConfig(){

    try{

        const response=await fetch(
            CONFIG_URL+"?t="+Date.now(),
            {cache:"no-store"}
        );

        if(!response.ok){
            throw new Error("Configuration unavailable");
        }

        const config=await response.json();

        const status=String(config.status||"AUDIO")
            .trim()
            .toUpperCase();

        const refresh=Number(config.refresh||0);

        if(status==="LIVE"){
            switchToLive();
            return;
        }

        const forceReload=
            lastRefresh!==-1 &&
            refresh!==lastRefresh;

        lastRefresh=refresh;

        switchToAudio(forceReload);

    }catch(error){

        if(mode!=="LIVE"){
            switchToAudio(false);
        }

        console.error("Kulzzy Radio configuration:",error);
    }
}

playButton.addEventListener("click",async function(){

    if(isLoading)return;

    if(mode==="LIVE"){

        try{

            if(liveAudio.paused){

                if(!liveAudio.src){
                    liveAudio.src=LIVE_STREAM_URL;
                    liveAudio.load();
                }

                await liveAudio.play();
                setButtonState(true);

            }else{

                liveAudio.pause();
                setButtonState(false);
            }

        }catch(error){

            setButtonState(false);
            console.error("Live stream playback error:",error);
        }

        return;
    }

    if(!audio.paused){

        audio.pause();
        setButtonState(false);
        return;
    }

    await playNormalAudio();
});

audio.addEventListener("play",function(){

    setButtonState(true);

    window.parent.postMessage({
        type:"KULZZY_AUDIOVISUALS",
        action:"audio-playing"
    },"*");
});

audio.addEventListener("pause",function(){

    if(mode==="AUDIO"){
        setButtonState(false);
    }
});

audio.addEventListener("ended",function(){

    if(mode!=="AUDIO")return;

    window.parent.postMessage({
        type:"KULZZY_AUDIOVISUALS",
        action:"audio-ended"
    },"*");

    needsRandomStart=true;
    playNormalAudio();
});

liveAudio.addEventListener("play",function(){
    setButtonState(true);
});

liveAudio.addEventListener("pause",function(){

    if(mode==="LIVE"){
        setButtonState(false);
    }
});

liveAudio.addEventListener("error",function(){

    setButtonState(false);

    console.error(
        "Kulzzy Radio live stream could not be played."
    );
});

loadConfig();

setInterval(loadConfig,3000);

})();
</script>
</body>
</html>
