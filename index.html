<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06122a">
<title>Kulzzy Radio Network</title>

<style>
*{box-sizing:border-box}

html,body{
    width:100%;
    min-height:100%;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    min-height:100dvh;
    padding:clamp(4px,1.2vw,16px);
    background:#06122a;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}

.radio{
    width:100%;
    max-width:1100px;
    min-width:0;
    margin:auto;
    overflow:hidden;
}

/* NORMAL AUDIO PLAYER */

.audio-panel{
    width:100%;
    min-width:0;
    background:#031326;
    border:clamp(2px,.45vw,5px) solid #ffd700;
    box-shadow:0 5px 24px rgba(0,0,0,.3);
}

.header{
    width:100%;
    min-width:0;
    min-height:clamp(100px,18vw,175px);
    padding:clamp(10px,3vw,28px);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:clamp(8px,2vw,24px);
    border-bottom:2px solid rgba(255,255,255,.12);
    background:linear-gradient(120deg,#061b31,#031326);
}

.brand{
    display:flex;
    align-items:center;
    gap:clamp(8px,2vw,22px);
    flex:1 1 auto;
    min-width:0;
}

.brand-dot{
    width:clamp(15px,4vw,42px);
    height:clamp(15px,4vw,42px);
    flex:0 0 auto;
    border-radius:50%;
    background:#ff1025;
    box-shadow:0 0 22px rgba(255,0,35,.6);
}

.brand-text{min-width:0}

.brand-name{
    color:#ffd700;
    font-size:clamp(17px,4.1vw,43px);
    line-height:1.13;
    font-weight:900;
    overflow-wrap:break-word;
}

.slogan{
    margin-top:clamp(5px,1.4vw,15px);
    color:#c8d2df;
    font-size:clamp(11px,2.4vw,25px);
    line-height:1.3;
}

.live-badge{
    width:clamp(58px,13vw,145px);
    height:clamp(58px,13vw,145px);
    flex:0 0 auto;
    border-radius:50%;
    background:#f20c20;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(2px,.7vw,8px);
    color:#fff;
    font-size:clamp(13px,2.8vw,31px);
    font-weight:bold;
}

.live-dot{
    font-size:clamp(14px,2.8vw,28px);
    line-height:1;
}

.play-area{
    width:100%;
    min-width:0;
    min-height:clamp(180px,32vw,350px);
    padding:clamp(16px,3.5vw,35px) 12px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:16px;
    background:linear-gradient(120deg,#061b31,#031326);
}

.play-button{
  width:clamp(75px,14vw,150px);
height:clamp(75px,14vw,150px);;
    max-width:70%;
    aspect-ratio:1/1;
    flex:0 1 auto;
    padding:0;
    border:clamp(4px,.7vw,7px) solid #ffd700;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ff2638,#ed001d 72%);
    color:#fff;
    font-size:clamp(36px,6vw,68px);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 0 35px rgba(255,0,30,.32);
    touch-action:manipulation;
}

.play-button:disabled{
    opacity:.65;
    cursor:wait;
}

.play-button span{
    display:block;
    line-height:1;
}

.now-playing{
    max-width:100%;
    padding:8px 12px;
    color:#ffd700;
    text-align:center;
    font-weight:bold;
    font-size:clamp(13px,2.5vw,20px);
    overflow-wrap:anywhere;
}

.player-message{
    max-width:100%;
    padding:0 10px;
    color:#c8d2df;
    text-align:center;
    font-size:13px;
    line-height:1.5;
}

/* COMPACT WHITE LIVE PLAYER */

.live-panel{
    display:none;
    width:100%;
    min-width:0;
    background:#fff;
    color:#202020;
    border:1px solid #dedede;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 5px 24px rgba(0,0,0,.3);
}

.live-panel.visible{display:block}
.audio-panel.hidden{display:none}

.live-header{
    padding:10px;
    background:#fff;
    color:#222;
    text-align:center;
    border-bottom:1px solid #e5e5e5;
}


.live-logo{
    font-size:clamp(14px,2.5vw,22px);
    font-weight:900;
    line-height:1.2;
    overflow-wrap:anywhere;
}

.live-subtitle{
    margin-top:3px;
    color:#555;
    font-size:clamp(10px,1.8vw,13px);
    line-height:1.2;
}

.live-content{
    width:100%;
    min-width:0;
    padding:14px 10px;
    background:#fff;
}

.live-audio{
    display:block;
    width:100%;
    max-width:650px;
    min-width:0;
    height:54px;
    margin:0 auto;
}

.live-message{
    margin-top:5px;
    color:#555;
    text-align:center;
    font-size:11px;
    line-height:1.3;
    overflow-wrap:anywhere;
}

@media(max-width:360px){
    body{padding:4px}

    .header{
        min-height:96px;
        padding:10px 8px;
        gap:6px;
    }

    .brand{gap:7px}
    .brand-name{font-size:clamp(15px,4.5vw,17px)}
    .slogan{font-size:10px;margin-top:5px}

    .live-badge{
        width:53px;
        height:53px;
        font-size:12px;
    }

    .live-dot{font-size:13px}

    .play-area{
        min-height:165px;
        padding:12px;
    }

.play-button{
    width:75px;
    height:75px;
    font-size:32px;
}

    .live-header{padding:7px}
    .live-content{padding:7px}
    .live-audio{height:50px}
}

@media(min-width:600px){
    .radio{max-width:900px}
    .header{padding:clamp(20px,3vw,32px)}
    .play-area{min-height:clamp(240px,32vw,350px)}
}

@media(min-width:1000px){
    .radio{max-width:1100px}
    .header{min-height:175px}
    .play-area{min-height:350px}
    .play-button{width:175px;height:175px}
}
</style>
</head>

<body>
<div class="radio">

    <!-- NORMAL AUDIO PLAYER -->
    <section id="audioPanel" class="audio-panel">
        <header class="header">
            <div class="brand">
                <div class="brand-dot"></div>
                <div class="brand-text">
                    <div class="brand-name">KULZZY RADIO<br>NETWORK</div>
                    <div class="slogan">Celebrating Lives Everyday</div>
                </div>
            </div>

            <div class="live-badge">
                <span class="live-dot">●</span>
                <span>RADIO</span>
            </div>
        </header>

        <div class="play-area">
            <button id="playButton" class="play-button" type="button"
                    aria-label="Play Kulzzy Radio">
                <span id="playIcon">▶</span>
            </button>

            <div id="audioTitle" class="now-playing">
                KULZZY RADIO AUTOMATIC AUDIO
            </div>

            <div id="audioMessage" class="player-message">
                Tap the button to listen.
            </div>

            <audio id="normalAudio" preload="auto" playsinline></audio>
        </div>
    </section>

    <!-- COMPACT LIVE PLAYER -->
    <section id="livePanel" class="live-panel">
        <header class="live-header">
            <div class="live-logo">KULZZY RADIO NETWORK</div>
            <div class="live-subtitle">Celebrating Lives Everyday</div>
        </header>

        <div class="live-content">
            <audio id="liveAudio" class="live-audio"
                   controls playsinline preload="none"></audio>
            <div id="liveMessage" class="live-message"></div>
        </div>
    </section>

</div>

<script>
"use strict";

(function(){
    const CONFIG_URL = "./config.json";
    const LIVE_STREAM_URL =
        "https://icecast.gocast.fm/stream/kulzzy-radio-network";

    const audioPanel = document.getElementById("audioPanel");
    const livePanel = document.getElementById("livePanel");
    const normalAudio = document.getElementById("normalAudio");
    const liveAudio = document.getElementById("liveAudio");
    const playButton = document.getElementById("playButton");
    const playIcon = document.getElementById("playIcon");
    const audioTitle = document.getElementById("audioTitle");
    const audioMessage = document.getElementById("audioMessage");
    const liveMessage = document.getElementById("liveMessage");

    let currentMode = "";
    let currentAudioURL = "";
    let currentRefresh = null;
    let audioPlayMode = "REPEAT";
    let configRequestRunning = false;

    function setNormalButton(playing){
        playIcon.textContent = playing ? "Ⅱ" : "▶";
        playButton.setAttribute(
            "aria-label",
            playing ? "Pause Kulzzy Radio" : "Play Kulzzy Radio"
        );
    }

    function showNormalPanel(){
        audioPanel.classList.remove("hidden");
        livePanel.classList.remove("visible");
    }

    function showLivePanel(){
        audioPanel.classList.add("hidden");
        livePanel.classList.add("visible");
    }

    function stopNormalAudio(){
        normalAudio.pause();
        normalAudio.removeAttribute("src");
        normalAudio.load();
        currentAudioURL = "";
        setNormalButton(false);
    }

    function stopLiveAudio(){
        liveAudio.pause();
        liveAudio.removeAttribute("src");
        liveAudio.load();
    }

    function getAudioURL(config){
        const configuredAudio = String(config.currentAudio || "").trim();
        if(!configuredAudio)return "";

        try{
            return new URL(configuredAudio, window.location.href).href;
        }catch(error){
            return configuredAudio;
        }
    }

    function switchToLive(config){
        if(currentMode !== "LIVE"){
            stopNormalAudio();
            currentMode = "LIVE";
            liveAudio.src = config.liveStream || LIVE_STREAM_URL;
            liveAudio.load();
        }

        showLivePanel();
        liveMessage.textContent = "";
    }

    function switchToNormalAudio(config, forceReload){
        if(currentMode === "LIVE"){
            stopLiveAudio();
        }

        currentMode = "AUDIO";
        showNormalPanel();

        const audioURL = getAudioURL(config);
        audioPlayMode = String(config.playMode || "REPEAT").toUpperCase();
        normalAudio.loop = audioPlayMode !== "ONCE";

        audioTitle.textContent =
            config.nowPlaying ||
            config.normalAudioTitle ||
            config.title ||
            "KULZZY RADIO AUTOMATIC AUDIO";

        if(!audioURL){
            stopNormalAudio();
            audioMessage.textContent =
                "No audio file is configured in the admin panel.";
            return;
        }

        if(forceReload || currentAudioURL !== audioURL){
            stopNormalAudio();
            currentAudioURL = audioURL;
            normalAudio.src = audioURL;
            normalAudio.load();
            audioMessage.textContent = "Audio is ready. Tap the button to listen.";
        }
    }

    async function loadConfig(){
        if(configRequestRunning)return;
        configRequestRunning = true;

        try{
            const response = await fetch(
                CONFIG_URL + "?t=" + Date.now(),
                {cache:"no-store"}
            );

            if(!response.ok)throw new Error("Could not load radio settings.");

            const config = await response.json();
            const status = String(config.status || config.mode || "AUDIO")
                .trim().toUpperCase();

            const refreshChanged =
                currentRefresh !== null &&
                config.refresh !== currentRefresh;

            currentRefresh = config.refresh;

            if(status === "LIVE"){
                switchToLive(config);
            }else{
                switchToNormalAudio(config, refreshChanged);
            }
        }catch(error){
            console.error("Kulzzy Radio configuration:", error);

            if(!currentMode){
                showNormalPanel();
                audioMessage.textContent =
                    "Unable to load radio settings. Check your connection.";
            }
        }finally{
            configRequestRunning = false;
        }
    }

    playButton.addEventListener("click", async function(){
        if(currentMode === "LIVE")return;

        if(!normalAudio.paused){
            normalAudio.pause();
            return;
        }

        if(!normalAudio.src){
            audioMessage.textContent = "No audio file is available to play.";
            return;
        }

        playButton.disabled = true;
        audioMessage.textContent = "Loading audio...";

        try{
            await normalAudio.play();
            audioMessage.textContent = "Now playing Kulzzy Radio automatic audio.";
        }catch(error){
            console.error(error);
            audioMessage.textContent =
                "Audio could not start. Check your connection and try again.";
        }finally{
            playButton.disabled = false;
        }
    });

    normalAudio.addEventListener("play", function(){
        setNormalButton(true);
    });

    normalAudio.addEventListener("pause", function(){
        setNormalButton(false);
    });

    normalAudio.addEventListener("ended", function(){
        if(currentMode !== "AUDIO")return;

        if(audioPlayMode === "ONCE"){
            setNormalButton(false);
            audioMessage.textContent = "Audio finished playing.";
            return;
        }

        normalAudio.currentTime = 0;
        normalAudio.play().catch(function(error){
            console.error(error);
        });
    });

    normalAudio.addEventListener("error", function(){
        if(currentMode !== "AUDIO")return;
        audioMessage.textContent =
            "Audio could not load. Check the audio file or your connection.";
    });

    liveAudio.addEventListener("error", function(){
        if(currentMode === "LIVE"){
            liveMessage.textContent = "Live stream connection failed. Try pressing play again.";
        }
    });

    loadConfig();
    setInterval(loadConfig, 2000);
})();
</script>
</body>
</html>
